<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,minimal-ui">
  <!-- 关键：禁止携带 Referer，绕过大部分源站的防盗链检测 -->
  <meta name="referrer" content="no-referrer">
  <title>视频播放</title>
  <style>
    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden;
      background: #000;
      display: flex; flex-direction: column;
    }
    #mse { flex: auto; width: 100%; }
    /* 顶部标题栏 */
    #topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
      padding: 8px 14px;
      font: 14px/1.4 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #fff;
      background: linear-gradient(to bottom, rgba(0,0,0,.55), transparent);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      pointer-events: none;
      opacity: 0; transition: opacity .3s;
    }
    body.show-ui #topbar { opacity: 1; }
    /* 错误遮罩 */
    #err {
      position: fixed; inset: 0; z-index: 10000;
      display: none; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; color: #eee; font: 14px/1.6 sans-serif; text-align: center; padding: 20px;
    }
    #err .retry {
      padding: 8px 22px; border: none; border-radius: 6px; cursor: pointer;
      background: #1890ff; color: #fff; font-size: 14px;
    }
    /* ===== 解锁层（与本站 play.html 同一套视觉：半透明黑遮罩 + 居中深灰圆角卡片） ===== */
    #gate {
      position: fixed; left: 0; right: 0; top: 0; bottom: 0; z-index: 10002; display: none;
      flex-direction: column; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 20px; text-align: center; box-sizing: border-box;
      background: rgba(0,0,0,.86); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
      -webkit-tap-highlight-color: transparent;
    }
    /* margin:auto 居中：空间够时居中，键盘弹出/内容超高时可滚动，不会被裁掉 */
    #gate .g-card {
      width: 100%; max-width: 330px; margin: auto; box-sizing: border-box;
      padding: 24px 18px 20px; display: flex; flex-direction: column;
      background: linear-gradient(180deg, #242427, #1a1a1c);
      border: 1px solid rgba(255,255,255,.07); border-radius: 16px;
      box-shadow: 0 18px 50px rgba(0,0,0,.6);
    }
    #gate .g-card > * { flex: 0 0 auto; }
    #gate .g-head { display: flex; align-items: center; justify-content: center; gap: 8px; }
    #gate .g-ico { display: flex; align-items: center; line-height: 0; }
    #gate .g-title { font-size: 21px; font-weight: 700; letter-spacing: 1.5px; color: #fff; }
    #gate .g-hint { color: #9a9a9f; font-size: 13.5px; line-height: 1.6; margin-top: 10px; }
    #gate .g-vtitle {
      color: #6f6f74; font-size: 11.5px; margin-top: 6px; line-height: 1.5;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    /* 16px 是 iOS 的及格线：小于 16px 聚焦时 Safari/微信会自动放大整页 */
    #gate input {
      width: 100%; height: 48px; box-sizing: border-box; margin-top: 16px;
      border-radius: 10px; border: 1px solid rgba(255,255,255,.08);
      background: #2c2c2f; color: #fff; outline: none;
      font-size: 16px; padding: 0 14px; text-align: center; letter-spacing: 1px;
      -webkit-appearance: none; appearance: none;
    }
    #gate input::placeholder { color: #7b7b80; letter-spacing: .5px; }
    #gate input:focus {
      border-color: #f7d40a; background: #323236; box-shadow: 0 0 0 3px rgba(247,212,10,.12);
    }
    #gate .g-btn { display: none; }   /* 兜底提交按钮：默认隐藏，只留 Enter / 自动解锁 */
    #gate .g-err { color: #ff6b6b; font-size: 12.5px; min-height: 14px; margin-top: 6px; }
    #gate .g-get { width: 100%; margin-top: 2px; }
    #gate .g-yellow, #gate .g-blue {
      display: block; width: 100%; box-sizing: border-box; height: 46px; cursor: pointer;
      border: none; border-radius: 8px; padding: 0; letter-spacing: .5px;
      font: 700 15px/46px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    #gate .g-yellow { margin-top: 10px; background: #f7d40a; color: #1a1a1a; }
    #gate .g-yellow:active { background: #e3c009; }
    #gate .g-blue { margin-top: 10px; background: #29b6f6; color: #fff; }
    #gate .g-blue:active { background: #1fa5e2; }
    #gate .g-qr {
      max-width: 200px; width: 60%; margin: 14px auto 0; display: none;
      border-radius: 10px; background: #fff; padding: 6px;
    }
    #gate .g-tip { color: #8a8a90; font-size: 11.5px; margin-top: 10px; line-height: 1.7; }
    /* 静态水印 */
    .wm-static {
      position: fixed; inset: 0; z-index: 9998; pointer-events: none;
      background-repeat: repeat !important;
    }
    /* 弹幕式移动水印 */
    .wm-move {
      position: fixed; z-index: 9998; pointer-events: none;
      color: rgba(255,255,255,.55); font: bold 18px sans-serif;
      white-space: nowrap; text-shadow: 0 0 2px rgba(0,0,0,.6);
      will-change: left, top;
    }
    /* 下一集提示 */
    #next-tip {
      position: fixed; right: 16px; bottom: 90px; z-index: 10001;
      display: none; padding: 10px 18px; border-radius: 8px;
      background: rgba(0,0,0,.75); color: #fff; font: 14px sans-serif;
      cursor: pointer; border: 1px solid rgba(255,255,255,.2);
    }
    /* ===== 底部自定义按钮栏 ===== */
    #btnbar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 9997;
      display: flex; flex-direction: column; gap: 6px;
      padding: 8px 10px; box-sizing: border-box;
      background: rgba(12,12,14,.92);
    }
    #btnbar .vbtn {
      height: 44px; line-height: 44px; border: none; cursor: pointer;
      border-radius: 8px; text-align: center;
      font: 600 15px/44px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #fff; letter-spacing: .5px;
      background: linear-gradient(135deg, #ff5f6d, #ff8a5c);
      box-shadow: 0 2px 8px rgba(255,95,109,.35);
      transition: transform .15s, filter .15s;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #btnbar .vbtn:active { transform: scale(.98); filter: brightness(1.12); }
    /* ===== 播放器内悬浮按钮 ===== */
    #pbtns {
      position: fixed; right: 12px; bottom: 72px; z-index: 9997;
      display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
    }
    #pbtns .pbtn {
      padding: 6px 14px; border-radius: 999px; cursor: pointer;
      background: rgba(0,0,0,.62); color: #fff; border: 1px solid rgba(255,255,255,.25);
      font: 600 13px/1.4 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      backdrop-filter: blur(4px);
      -webkit-tap-highlight-color: transparent;
      max-width: 60vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #pbtns .pbtn:active { background: rgba(255,95,109,.75); }
    /* ===== 开播确认页（封面） ===== */
    #cover {
      position: fixed; inset: 0; z-index: 10002;
      display: none; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(180deg, #101b36 0%, #0b1226 100%);
      transition: opacity .35s;
    }
    #cover.hide { opacity: 0; pointer-events: none; }
    .cover-thumb {
      position: relative; width: 168px; height: 96px; border-radius: 12px; overflow: hidden;
      background: #000; box-shadow: 0 8px 28px rgba(0,0,0,.55);
    }
    .cover-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cover-thumb .ph {
      position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
      font-size: 32px; color: #fff; background: linear-gradient(135deg,#1c2a4a,#101a30);
    }
    .cover-thumb .tag {
      position: absolute; left: 6px; top: 6px; padding: 1px 7px; border-radius: 5px;
      background: rgba(0,0,0,.55); color: #fff; font: 11px/1.6 sans-serif;
    }
    .cover-hint {
      margin-top: 16px; color: #fff;
      font: 600 16px/1.4 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    #startBtn {
      margin-top: 14px; width: 172px; height: 44px; border: none; border-radius: 22px; cursor: pointer;
      background: linear-gradient(135deg, #37e2ff, #2f7bff);
      color: #fff; letter-spacing: 2px;
      font: 600 15px/44px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      box-shadow: 0 6px 22px rgba(47,123,255,.45);
      -webkit-tap-highlight-color: transparent;
      transition: transform .15s;
    }
    #startBtn:active { transform: scale(.97); }
    .cover-notice {
      margin-top: 18px; padding: 11px 16px; border-radius: 10px; max-width: 80vw; box-sizing: border-box;
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09);
    }
    .cover-notice p { margin: 3px 0; font: 12px/1.7 -apple-system, "PingFang SC", sans-serif; }
    /* ===== 强制播放器控件常驻（关闭自动隐藏） ===== */
    .xgplayer-controls.controls-autohide,
    .xgplayer-inactive .controls-autohide {
      visibility: visible !important; opacity: 1 !important; pointer-events: auto !important;
    }
    .xgplayer-inactive xg-bar { display: block !important; }
    .xgplayer-inactive { cursor: default !important; }
  </style>
  <link rel="stylesheet" href="./assets/xgplayer.css">
</head>

<body>
<div id="mse"></div>
<div id="topbar"></div>
<div id="err">
  <div id="err-msg">😢 视频加载失败，可能原因：<br>链接失效 / 源站防盗链 / 格式不支持</div>
  <button class="retry" onclick="location.reload()">重新加载</button>
</div>
<div id="next-tip">▶ 播放下一集</div>

<!-- 卡密 / 访问密码门：在 GitHub 页面上直接验证，跨域调本站 /api/video/:id/unlock -->
<div id="gate">
  <div class="g-card">
    <div class="g-head">
      <span class="g-ico" aria-hidden="true">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#f7d40a" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <rect x="3.6" y="10.2" width="16.8" height="10.4" rx="2.6"></rect>
          <path d="M7.6 10.2V6.9a4.2 4.2 0 0 1 8-1.5"></path>
          <circle cx="12" cy="15.4" r="1.35" fill="#f7d40a" stroke="none"></circle>
        </svg>
      </span>
      <span class="g-title">解锁观看</span>
    </div>
    <div class="g-hint" id="gHint"></div>
    <div class="g-vtitle" id="gVTitle" style="display:none"></div>
    <input id="gPass" type="text" autocomplete="off" autocapitalize="off" autocorrect="off"
           spellcheck="false" placeholder="输入卡密自动解锁">
    <div class="g-err" id="gErr"></div>
    <button class="g-btn" id="gBtn" type="button">确认</button>
    <div class="g-get" id="gGet" style="display:none">
      <button class="g-yellow" id="gGetBtn" type="button">点击获取卡密</button>
      <button class="g-blue" id="gTut" type="button">查看获取卡密教程</button>
      <img class="g-qr" id="gQr" alt="扫码获取">
      <div class="g-tip" id="gTip"></div>
    </div>
  </div>
</div>

<div id="cover">
  <div class="cover-thumb">
    <span class="ph" style="display:flex;align-items:center;justify-content:center;font-size:42px;color:#fff;">▶</span>
    <span class="tag">视频封面</span>
  </div>
  <div class="cover-hint">点击开始播放</div>
  <button id="startBtn">开 始 播 放</button>
  <div class="cover-notice" id="coverNotice"></div>
</div>

<script src="./assets/xgplayer.min.js" charset="utf-8"></script>
<script src="./assets/hls-plugin.min.js" charset="utf-8"></script>
<script>
(function () {
  'use strict';

  /* ================= 参数解析 ================= */
  var qs = new URLSearchParams(location.search);

  function getParam(names) {
    for (var i = 0; i < names.length; i++) {
      var v = qs.get(names[i]);
      if (v) return v;
    }
    return null;
  }

  // url 支持四种传法：相对路径 / 明文 URL 编码 / base64 / base64url
  function decodeUrl(raw) {
    var t = raw.trim();
    if (t.charAt(0) === '/') return t; // 站内相对路径（配合后端代理使用）
    if (!/^https?:\/\//i.test(t)) {
      try {
        var b = t.replace(/-/g, '+').replace(/_/g, '/');
        while (b.length % 4) b += '=';
        var d = decodeURIComponent(escape(atob(b)));
        if (/^https?:\/\//i.test(d)) return d;
      } catch (e) { /* 不是 base64，继续 */ }
    }
    return t;
  }

  // 后端地址。github.io 是纯静态站，同域根本没有 /api/*，统计上报必须打到真实后端，
  // 否则 track 请求全是 404 → 后台统计恒为 0（9/21 起失效的真正原因）。
  var apiBase  = (getParam(['api']) || 'https://video2.bw4.cn').replace(/\/+$/, '');
  var videoId  = getParam(['id']);                               // 接口模式：视频 ID
  var shortId  = getParam(['i']);                               // Liblib 直链短码：owner/sha（省略固定前缀）
  var videoUrl = decodeUrl(getParam(['url', 'u', 'v']) || '');
  if (!videoUrl && shortId) {
    videoUrl = 'https://liblibai-online.liblib.cloud/img/' + shortId.replace(/[^A-Za-z0-9/_]/g, '') + '.mp4';
  }
  var title    = getParam(['title', 't']) || '';
  var nextUrl  = decodeUrl(getParam(['next', 'n']) || '');
  var wmText   = getParam(['wm', 'watermark']) || '';
  var wmType   = (getParam(['wmt']) || 'static').toLowerCase(); // static | move
  var autoNext = qs.get('autonext') !== '0';
  // 后台地址：?id= 优先向它取配置（读库 → 即时同步）；可用 ?sync= 覆盖
  var SYNC_BASE = qs.get('sync') || 'https://video2.bw4.cn';

  // 自定义按钮：
  //   底部栏   btn=按钮名称|跳转链接   （可重复多个）
  //   播放器内 pbtn=按钮名称|跳转链接  （可重复多个）
  var buttons = [];   // {title, url, pos:'bar'|'player'}
  var videoType = ''; // 'hls' | 'file' | '' 由 /api/video/:id 返回，决定要不要挂 HlsJsPlugin
  var noticeLines = []; // 免责声明（接口模式可自定义，静态模式用默认）
  var rawDirect = ''; // MP4 源站直连地址（服务器带宽小，大文件直连源站更快；失败回退代理）
  qs.getAll('btn').forEach(function (s) {
    var i = s.indexOf('|');
    if (i > 0 && /^https?:\/\//i.test(s.slice(i + 1))) {
      buttons.push({ title: s.slice(0, i), url: s.slice(i + 1), pos: 'bar' });
    }
  });
  qs.getAll('pbtn').forEach(function (s) {
    var i = s.indexOf('|');
    if (i > 0 && /^https?:\/\//i.test(s.slice(i + 1))) {
      buttons.push({ title: s.slice(0, i), url: s.slice(i + 1), pos: 'player' });
    }
  });
  var queryButtons = buttons.slice();   // 由 ?btn=/?pbtn= 解析出来的按钮（重同步时作为基底，避免叠加重复）

  function showError(msg) {
    document.getElementById('err-msg').innerHTML = msg;
    document.getElementById('err').style.display = 'flex';
  }

  /* ================= UI 显隐 ================= */
  var uiTimer = null;
  function showUI() {
    document.body.classList.add('show-ui');
    clearTimeout(uiTimer);
    uiTimer = setTimeout(function () { document.body.classList.remove('show-ui'); }, 3000);
  }
  ['touchstart', 'mousemove', 'click'].forEach(function (ev) {
    window.addEventListener(ev, showUI, { passive: true });
  });
  showUI();

  /* ================= 自定义按钮渲染 ================= */
  /* ================= 统计上报 ================= */
  // 用 navigator.sendBeacon 优先（页面跳转时不丢），失败退回 fetch
  function track(path, payload) {
    if (!videoId) return;
    try {
      var url = apiBase + path;
      var body = JSON.stringify(payload || {});
      if (navigator.sendBeacon) {
        var blob = new Blob([body], { type: 'application/json' });
        if (navigator.sendBeacon(url, blob)) return;
      }
      fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body, keepalive: true });
    } catch (e) { /* 统计失败不影响播放 */ }
  }
  function trackView() { track('/api/track/view/' + encodeURIComponent(videoId)); }
  function trackClick(idx, b) {
    track('/api/track/click/' + encodeURIComponent(videoId), { idx: idx, label: b.title, url: b.url });
  }

  function renderButtons() {
    // 保留原始下标，统计时要按下标对号入座
    var all = buttons.map(function (b, i) { return { b: b, i: i }; });
    var barList = all.filter(function (x) { return x.b.pos === 'bar'; });
    var plyList = all.filter(function (x) { return x.b.pos === 'player'; });

    if (barList.length) {
      var bar = document.createElement('div');
      bar.id = 'btnbar';
      barList.forEach(function (x) {
        var el = document.createElement('button');
        el.className = 'vbtn';
        el.textContent = x.b.title;
        el.onclick = function () { trackClick(x.i, x.b); location.href = x.b.url; };
        bar.appendChild(el);
      });
      document.body.appendChild(bar);
      // 底部留白，避免按钮遮住播放器控制条
      document.body.style.paddingBottom = (barList.length * 50 + 10) + 'px';
      // 下一集提示上移，避开按钮栏
      document.getElementById('next-tip').style.bottom = (barList.length * 50 + 20) + 'px';
    }

    if (plyList.length) {
      var wrap = document.createElement('div');
      wrap.id = 'pbtns';
      plyList.forEach(function (x) {
        var el = document.createElement('div');
        el.className = 'pbtn';
        el.textContent = x.b.title;
        el.onclick = function () { trackClick(x.i, x.b); location.href = x.b.url; };
        wrap.appendChild(el);
      });
      document.body.appendChild(wrap);
    }
  }

  /* ================= 水印 ================= */
  function addStaticWatermark(text) {
    var c = document.createElement('canvas');
    c.width = 300; c.height = 220;
    var ctx = c.getContext('2d');
    ctx.font = 'bold 18px Arial';
    ctx.fillStyle = 'rgba(120,120,120,.35)';
    ctx.translate(c.width / 2, c.height / 2);
    ctx.rotate(-20 * Math.PI / 180);
    ctx.textAlign = 'center';
    ctx.fillText(text, 0, 0);
    var d = document.createElement('div');
    d.className = 'wm-static';
    d.style.backgroundImage = 'url(' + c.toDataURL() + ')';
    document.body.appendChild(d);
  }

  function addMovingWatermark(text) {
    var el = document.createElement('div');
    el.className = 'wm-move';
    el.textContent = text;
    document.body.appendChild(el);
    var x = Math.random() * (innerWidth - 120);
    var y = Math.random() * (innerHeight - 40);
    var sx = Math.random() > .5 ? 1.4 : -1.4;
    var sy = Math.random() > .5 ? 1 : -1;
    (function tick() {
      x += sx; y += sy;
      if (x <= 0 || x >= innerWidth - el.offsetWidth) sx = -sx;
      if (y <= 0 || y >= innerHeight - el.offsetHeight) sy = -sy;
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      requestAnimationFrame(tick);
    })();
  }

  /* ================= 记忆播放 ================= */
  function urlKey() {
    var h = 0, s = videoUrl;
    for (var i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) | 0; }
    return 'vp:' + h;
  }
  function savePos(t) {
    try { localStorage.setItem(urlKey(), Math.floor(t)); } catch (e) {}
  }
  function loadPos() {
    try { return parseInt(localStorage.getItem(urlKey()) || '0', 10) || 0; } catch (e) { return 0; }
  }
  function clearPos() {
    try { localStorage.removeItem(urlKey()); } catch (e) {}
  }

  /* ================= 开播确认页 ================= */
  var DEFAULT_NOTICE = [
    '内容素材均来自朋友投稿',
    '内容只属娱乐不可完全当真',
    '如果侵犯权益我们立刻删除',
    '请尽量以官方渠道为准'
  ];
  var NOTICE_COLORS = ['#ff7849', '#ffd93d', '#ff6b9d', '#4da6ff', '#a78bfa', '#34d399'];
  var NOTICE_ICONS  = ['📢', '🎬', '📢', 'ℹ️', '🔔', '📌'];

  function renderNotice(lines) {
    var box = document.getElementById('coverNotice');
    var arr = (lines && lines.length) ? lines : DEFAULT_NOTICE;
    box.innerHTML = arr.map(function (s, i) {
      var c = NOTICE_COLORS[i % NOTICE_COLORS.length];
      return '<p style="color:' + c + '">' + NOTICE_ICONS[i % NOTICE_ICONS.length] + ' ' +
        s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</p>';
    }).join('');
  }

  function showCover() {
    var cover = document.getElementById('cover');
    // 重试过程中可能已经显示过「同步中」错误层，成功拿到视频后必须收起来，否则会盖住播放页
    var errEl = document.getElementById('err');
    if (errEl) errEl.style.display = 'none';
    renderNotice(noticeLines);
    cover.style.display = 'flex';
    document.getElementById('startBtn').addEventListener('click', startPlay);
  }

  function startPlay() {
    var cover = document.getElementById('cover');
    cover.classList.add('hide');
    setTimeout(function () { cover.style.display = 'none'; }, 360);
    boot();
  }

  /* ================= 初始化播放器 ================= */
  function boot() {
    // 优先级：接口返回的 type > URL 后缀 .m3u8 > 走 /api/m3u8/ 代理路径
    var isHls = videoType === 'hls'
      ? true
      : (videoType === 'file' ? false : /\.m3u8(\?|#|$|\/)/i.test(videoUrl) || /\/api\/m3u8\//i.test(videoUrl));

    document.title = title || '视频播放';
    document.getElementById('topbar').textContent = title || '';
    if (videoId) trackView();   // 上报一次观看
    renderButtons();
    if (wmText) {
      (wmType === 'move' ? addMovingWatermark : addStaticWatermark)(wmText);
    }

    var playUrl = rawDirect || videoUrl;   // MP4 优先直连源站（绕开服务器小带宽）
    var fellBack = false;
    var player = null;

    function bindEvents(p) {
      // 恢复上次的播放位置（接近结尾则从头）
      p.on('playing', function () {
        var saved = loadPos();
        if (saved > 10 && saved < p.duration - 15) {
          p.currentTime = saved;
        }
      });

      // 每 5 秒记忆一次进度
      var lastSave = 0;
      p.on('timeupdate', function () {
        var now = p.currentTime | 0;
        if (now - lastSave >= 5) { lastSave = now; savePos(now); }
      });

      // 直连失败 → 自动回退走服务器代理
      p.on('error', function () {
        if (playUrl !== videoUrl && !fellBack) {
          fellBack = true;
          try { p.destroy(); } catch (e) {}
          player = createPlayer(videoUrl);
          bindEvents(player);
          return;
        }
        showError('😢 视频加载失败，可能原因：<br>链接失效 / 源站防盗链 / 格式不支持');
      });

      // 播完：自动下一集
      p.on('ended', function () {
        clearPos();
        if (autoNext && nextUrl) {
          location.href = nextUrl;
          return;
        }
        if (nextUrl) {
          var tip = document.getElementById('next-tip');
          tip.style.display = 'block';
          tip.onclick = function () { location.href = nextUrl; };
        }
      });
    }

    function createPlayer(url) {
      return new window.Player({
        id: 'mse',
        url: url,
        isLive: false,
        autoplay: true,
        muted: true,            // 静音自动播放（浏览器策略），用户可点音量取消
        playsinline: true,
        fluid: true,            // 自适应容器
        playbackRate: [0.5, 0.75, 1, 1.25, 1.5, 2, 3],
        download: false,
        keyShortcut: true,      // 键盘快捷键：空格暂停、方向键快进、↑↓音量
        inactive: false,        // 关闭控件自动隐藏，进度条/设置常驻显示
        plugins: isHls ? [window.HlsJsPlugin] : []
      });
    }

    try {
      player = createPlayer(playUrl);
    } catch (e) {
      showError('😢 播放器初始化失败');
      return;
    }
    bindEvents(player);

    // 双击视频区域也可以跳下一集（无下一集时无动作）
    document.getElementById('mse').addEventListener('dblclick', function (e) {
      if (e.target.tagName === 'VIDEO' && nextUrl && !autoNext) {
        location.href = nextUrl;
      }
    });
  }

  /* ================= 入口 ================= */
  if (videoId) {
    // ?id= 模式取配置的优先级：
    //   ① 向 video2 后台取（读数据库 → 后台改标题/按钮/跳转链接「即时生效」）
    //   ② 后台不可用或没有这条 → 回落到仓库根 map.json（GitHub Pages 静态，有 30~120s 重建延迟，故带重试）
    var idTries = 0, ID_MAX_TRY = 15, ID_RETRY_MS = 8000;
    function hideErrOverlay() {
      var e = document.getElementById('err');
      if (e) e.style.display = 'none';
    }
    function playFromEntry(entry) {
      videoUrl = entry.url;
      /* 门禁视频的 HLS 走本站 /api/m3u8 代理，必须带 tk，否则 403 */
      var tk = loadTk() || entry.tk || '';
      if (tk && videoUrl && !/[?&]tk=/.test(videoUrl)) {
        videoUrl += (videoUrl.indexOf('?') >= 0 ? '&' : '?') + 'tk=' + encodeURIComponent(tk);
      }
      /* MP4：接口给的是本站 /api/media（302 到源站），真实源站地址不再下发 */
      if (entry.media) {
        rawDirect = entry.media + (tk ? ((entry.media.indexOf('?') >= 0 ? '&' : '?') + 'tk=' + encodeURIComponent(tk)) : '');
      }
      if (!title && entry.title) title = entry.title;
      if (Array.isArray(entry.buttons)) buttons = queryButtons.concat(entry.buttons);
      if (entry.type) videoType = entry.type;
      if (Array.isArray(entry.notice)) noticeLines = entry.notice;
      hideErrOverlay();
      showCover();
    }
    function fallbackBackend() {
      return fetch(apiBase + '/api/video/' + encodeURIComponent(videoId))
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (!j || j.code !== 1 || !j.data) {
            showError('⚠️ 链接不存在或已被删除');
            return;
          }
          if (!j.data.status) {
            showError('⚠️ 链接已被删除，无法访问');
            return;
          }
          videoUrl = apiBase + '/api/m3u8/' + encodeURIComponent(videoId);
          if (j.data.type === 'hls' || j.data.type === 'file') videoType = j.data.type;
          /* MP4 走本站 /api/media（302 到源站），源地址不下发 */
          if (j.data.type === 'file' && j.data.media) {
            rawDirect = apiBase + '/api/media/' + encodeURIComponent(videoId);
          }
          if (!title && j.data.title) title = j.data.title;
          if (Array.isArray(j.data.buttons)) buttons = buttons.concat(j.data.buttons);
          if (Array.isArray(j.data.notice)) noticeLines = j.data.notice;
          hideErrOverlay();
          showCover();
        })
        .catch(function () {
          showError('⚠️ 无法连接播放接口，请稍后重试');
        });
    }
    /* 向后台取某条视频配置（免鉴权公开接口 + CORS，读库所以即时）
     * 门禁视频：不再跳回本站，改为在本页弹卡密/密码门，跨域调本站 unlock 拿 token。
     * token 存 localStorage（按 sha），之后请求都带 ?tk=。 */
    var TK_KEY = 'ghtk:' + videoId;
    function loadTk() { try { return localStorage.getItem(TK_KEY) || ''; } catch (e) { return ''; } }
    function saveTk(t) {
      try { if (t) localStorage.setItem(TK_KEY, t); else localStorage.removeItem(TK_KEY); } catch (e) {}
    }
    var gateCtx = { mode: 'pwd', hint: '', link: '', img: '', id: '' };
    var gateShown = false;
    function isCodeGate() { return gateCtx.mode === 'code'; }
    function gateWord() { return isCodeGate() ? '卡密' : '访问密码'; }

    /* 手机键盘弹出 → 把门禁层高度对齐到「可视视口」，输入框不会被键盘盖住 */
    function syncGateVH() {
      var g = document.getElementById('gate');
      var vv = window.visualViewport;
      if (!g || !vv) return;
      g.style.height = vv.height + 'px';
      g.style.top = vv.offsetTop + 'px';
      g.style.bottom = 'auto';
    }
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', syncGateVH);
      window.visualViewport.addEventListener('scroll', syncGateVH);
    }

    /* 最近一次验证失败的值：用户没改动就不再自动重试，避免一次输错反复撞「失败 8 次锁 10 分钟」 */
    var gateLastFail = '';
    var gateBusy = false;
    var gateAutoT = null;

    function showGate(d) {
      var g = d.gate || {};
      gateShown = true;
      gateCtx.mode = (g.mode === 'code') ? 'code' : 'pwd';
      gateCtx.hint = g.hint || '';
      gateCtx.link = g.link || '';
      gateCtx.img = g.img || '';
      gateCtx.id = d.id || '';
      if (!title && d.title) title = d.title;
      gateLastFail = '';
      var w = gateWord();
      document.getElementById('gHint').textContent = gateCtx.hint ||
        (isCodeGate() ? '请输入卡密观看完整视频' : '请输入密码观看完整视频');
      /* 视频标题放底部小灰字，主体固定「解锁观看」 */
      var vt = document.getElementById('gVTitle');
      var t = d.title || title || '';
      if (t) { vt.textContent = t; vt.style.display = 'block'; } else { vt.style.display = 'none'; }
      var p = document.getElementById('gPass');
      p.value = '';
      p.placeholder = '输入' + w + '自动解锁';
      document.getElementById('gErr').textContent = '';
      document.getElementById('gBtn').textContent = '确认';
      var btnGet = document.getElementById('gGet');
      btnGet.style.display = (gateCtx.link || gateCtx.img) ? 'block' : 'none';
      document.getElementById('gGetBtn').textContent = '点击获取' + w;
      document.getElementById('gTut').textContent = '查看获取' + w + '教程';
      document.getElementById('gQr').style.display = 'none';
      document.getElementById('gTip').style.display = 'none';
      document.getElementById('gate').style.display = 'flex';
      hideErrOverlay();
      syncGateVH();
      try { p.focus(); } catch (e) {}
    }

    function doUnlock() {
      var p = document.getElementById('gPass');
      var v = (p.value || '').trim();
      var err = document.getElementById('gErr');
      var btn = document.getElementById('gBtn');
      if (gateBusy) return;
      if (!v) { err.textContent = '请输入' + gateWord(); return; }
      if (gateAutoT) { clearTimeout(gateAutoT); gateAutoT = null; }
      gateBusy = true;
      btn.disabled = true;
      err.textContent = '验证中…';
      var payload = isCodeGate() ? { code: v } : { password: v };
      fetch(SYNC_BASE + '/api/video/' + encodeURIComponent(gateCtx.id || videoId) + '/unlock', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).then(function (r) { return r.json(); })
        .then(function (j) {
          if (j && j.code === 1) {
            saveTk((j.data && j.data.token) || '');
            err.textContent = '';
            gateLastFail = '';
            try { p.blur(); } catch (e) {}
            document.getElementById('gate').style.display = 'none';
            gateShown = false;
            loadId();
          } else {
            gateLastFail = v;
            err.textContent = (j && j.msg) || (gateWord() + '不正确');
            if (j && typeof j.left === 'number') err.textContent += '（还可尝试 ' + j.left + ' 次）';
          }
        })
        .catch(function () { err.textContent = '网络异常，请重试'; })
        .then(function () { gateBusy = false; btn.disabled = false; });
    }

    /* 黄色「点击获取」：微信内且配了路径 → 直接跳；否则展示扫码图；都没有就给提示
       蓝色「查看教程」：同上面板，但不自动跳走，多给一段编号步骤 */
    function openGet(tut) {
      var qr = document.getElementById('gQr');
      var tip = document.getElementById('gTip');
      var wx = /MicroMessenger/i.test(navigator.userAgent || '');
      var w = gateWord();
      if (wx && gateCtx.link && !tut) { location.href = gateCtx.link; return; }
      if (gateCtx.img) {
        qr.onerror = function () { qr.style.display = 'none'; };
        qr.src = /^https?:/i.test(gateCtx.img) ? gateCtx.img : (SYNC_BASE + gateCtx.img);
        qr.style.display = 'block';
        tip.textContent = tut
          ? ('① 长按识别二维码 → ② 按提示领取' + w + ' → ③ 回到本页粘贴输入即可自动解锁')
          : (wx ? ('长按识别上图，按提示领取' + w) : ('请用另一台手机的微信扫描上图，领取' + w));
        tip.style.display = 'block';
        /* 教程模式：已有二维码也把「打开小程序」按钮露出来，微信内可直接点 */
        if (tut && gateCtx.link) {
          var mp = document.getElementById('ggMpInline');
          if (!mp) {
            mp = document.createElement('a');
            mp.id = 'ggMpInline';
            mp.className = 'g-yellow';
            mp.style.textDecoration = 'none';
            mp.textContent = '打开小程序领取' + w;
            mp.href = gateCtx.link;
            qr.parentNode.insertBefore(mp, qr);
          }
          mp.style.display = 'block';
        }
        return;
      }
      tip.textContent = gateCtx.link
        ? (tut
            ? ('① 复制本页链接 → ② 在微信中打开 → ③ 点「点击获取' + w + '」领取 → ④ 回到本页输入')
            : ('请复制本页链接，在微信中打开后点击「点击获取' + w + '」'))
        : ('请联系发布者获取' + w);
      tip.style.display = 'block';
    }

    function fetchServer() {
      var tk = loadTk();
      var url = SYNC_BASE + '/api/video/' + encodeURIComponent(videoId) +
        '?t=' + Date.now() + (tk ? '&tk=' + encodeURIComponent(tk) : '');
      return fetch(url, { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (j) {
          if (!j || j.code !== 1 || !j.data) return null;
          var d = j.data;
          if (d.locked) { showGate(d); return null; }
          if (!d.url) return null;
          return d;
        })
        .catch(function () { return null; });
    }
    function fetchMap() {
      return fetch('map.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : {}; })
        .catch(function () { return {}; });
    }
    /* 后台改了配置后，本页自动更新标题/按钮/免责声明，无需手动刷新 */
    function applyUpdate(en) {
      if (en.title) {
        title = en.title;
        var tb = document.getElementById('topbar');
        if (tb) tb.textContent = title;
        document.title = title;
      }
      buttons = queryButtons.concat(Array.isArray(en.buttons) ? en.buttons : []);
      var ob = document.getElementById('btnbar'); if (ob) ob.remove();
      var op = document.getElementById('pbtns'); if (op) op.remove();
      renderButtons();
      if (Array.isArray(en.notice)) { noticeLines = en.notice; renderNotice(noticeLines); }
    }
    function startResync(entry, fromServer) {
      var lastSig = JSON.stringify(entry);
      var timer = setInterval(function () {
        var p = fromServer ? fetchServer() : fetchMap().then(function (m) { return m[videoId] || null; });
        p.then(function (en) {
          if (!en || !en.url) return;
          var sig = JSON.stringify(en);
          if (sig === lastSig) return;
          lastSig = sig;
          applyUpdate(en);
        }).catch(function () { /* 忽略网络抖动 */ });
      }, 10000);
      setTimeout(function () { clearInterval(timer); }, 15 * 60 * 1000); // 15 分钟后停止轮询
    }
    function loadId() {
      idTries++;
      fetchServer().then(function (entry) {
        if (entry) { playFromEntry(entry); startResync(entry, true); return; }
        /* 已弹出卡密门 → 等用户输入，别再走重试/回落（否则会把门禁层覆盖成「同步中」） */
        if (gateShown) return;
        // 后台没有这条 / 后台不可用 → 回落 GitHub 静态 map.json
        return fetchMap().then(function (map) {
          var en = map && map[videoId];
          if (en && en.url) { playFromEntry(en); startResync(en, false); return; }
          if (idTries < ID_MAX_TRY) {
            showError('⏳ 视频正在同步中…（刚上传时 GitHub 约需 1~2 分钟，已自动重试 ' + idTries + '/' + ID_MAX_TRY + ' 次，请勿关闭本页）');
            setTimeout(loadId, ID_RETRY_MS);
            return;
          }
          // 都没有，且显式带了 ?api= 后端地址 → 退回后端接口模式
          if (apiBase) { fallbackBackend(); return; }
          showError('⚠️ 该 id 不存在或视频已失效（已重试 ' + ID_MAX_TRY + ' 次）');
        });
      }).catch(function () {
        if (idTries < ID_MAX_TRY) {
          showError('⏳ 暂时取不到视频信息，正在重试 ' + idTries + '/' + ID_MAX_TRY + ' 次…');
          setTimeout(loadId, ID_RETRY_MS);
          return;
        }
        showError('⚠️ 无法加载视频信息，请稍后重试');
      });
    }
    /* 卡密门交互绑定 */
    document.getElementById('gBtn').addEventListener('click', doUnlock);
    document.getElementById('gPass').addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.keyCode === 13) doUnlock();
    });
    document.getElementById('gGetBtn').addEventListener('click', function () { openGet(false); });
    document.getElementById('gTut').addEventListener('click', function () { openGet(true); });
    /* 输入即自动解锁：停顿 550ms 且长度 ≥4 才提交；与上次失败值相同则不再重试 */
    document.getElementById('gPass').addEventListener('input', function () {
      var v = (this.value || '').trim();
      var err = document.getElementById('gErr');
      if (gateAutoT) { clearTimeout(gateAutoT); gateAutoT = null; }
      if (err.textContent) err.textContent = '';
      if (v.length < 4 || v === gateLastFail) return;
      gateAutoT = setTimeout(function () {
        gateAutoT = null;
        if (!gateBusy) doUnlock();
      }, 550);
    });

    loadId();
  } else {
    // 静态模式：?url= / ?i= 直接播放
    if (!videoUrl) {
      // 演示模式：无参数时加载测试视频，方便部署后自检
      videoUrl = 'https://media.w3.org/2010/05/sintel/trailer.mp4';
      title = '部署自检演示视频（传 ?url= / ?i= / ?id= 参数即可播放你自己的视频）';
    }
    showCover();
  }
})();
</script>
</body>
</html>
